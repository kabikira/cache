name: cache
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#0D47A1"
  image: assets/images/splash_logo.png
  # 最小限の出力に寄せるため、Web は生成しない
  web: false
  # Android/iOS のみ対応（必要なら android_12 ブロックを再追加）
  android: true
  ios: true
